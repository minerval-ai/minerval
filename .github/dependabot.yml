# Weekly version updates for the three npm projects and the workflows'
# actions. Minor and patch bumps land as one grouped PR per project; each
# major bump gets its own PR, since those can need code changes.
#
# The cooldown holds back any version published less than a week ago. A
# hijacked maintainer account usually gets its malicious release pulled
# within hours or days, so a week-old release has had time to be caught.
# Security updates (Dependabot alerts) skip the cooldown and open
# immediately.

version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # @types/node tracks the Node version we run (22, in CI and the
    # images), not the newest Node; a major bump would describe APIs the
    # runtime doesn't have. Raise it by hand when the runtime moves.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      backend-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /extension
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore: # as for /
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      extension-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /infra
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore: # as for /
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      infra-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore: # as for /
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]

  # Baked into the lean-checker image, which is built and pushed by hand
  # (lean-checker/README.md): a merged bump takes effect at the next
  # image build.
  - package-ecosystem: npm
    directory: /lean-checker/server
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore: # as for /
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      lean-checker-minor-and-patch:
        update-types: [minor, patch]

  # Actions are pinned to commit SHAs with the version in a trailing
  # comment; Dependabot bumps both together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
