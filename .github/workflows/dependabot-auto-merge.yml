name: Dependabot auto-merge

# Merges Dependabot's patch and minor updates, security fixes and routine
# version updates alike, once CI passes, so dependency upkeep doesn't wait
# on a person. This is the pattern GitHub documents ("Automating Dependabot
# with GitHub Actions"), with two extra refusals. It only turns on GitHub's
# auto-merge: the merge itself waits for the checks main's ruleset
# requires, and this workflow refuses to act unless that ruleset requires
# the CI jobs that build what is being bumped.
#
# The supply-chain defense for version updates is the 7-day cooldown in
# .github/dependabot.yml: a hijacked release is usually pulled within days.
# Security updates skip the cooldown, which is what the maintainer-change
# refusal below is for.
#
# A PR qualifies when all of these hold:
#   - it is a patch or minor bump (a major can need code changes);
#   - Dependabot reports no maintainer change for the package (a new
#     publisher pushing a release is the shape of a takeover);
#   - it is in a directory CI builds: /, /infra, /web or /extension.
# A PR that misses any of these gets one comment saying why, and waits for
# the weekly maintenance pass (docs/infrastructure.md).
#
# pull_request_target runs this file from main with a write token; it never
# checks out or runs the PR's code, so that is safe here. Workflows run by
# Dependabot on plain pull_request get a read-only token and no secrets.
#
# Setup (docs/infrastructure.md, "Dependabot auto-merge"):
#   - Settings → Code security → "Dependabot alerts" and "Dependabot
#     security updates" both on; without them no security PR is opened;
#   - Settings → General → "Allow auto-merge";
#   - a ruleset on main requiring the status checks check, db-tests, web
#     and extension.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, closed]

jobs:
  auto-merge:
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Read the Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ github.token }}

      - name: Decide and enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          ACTION: ${{ github.event.action }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          MAINTAINER_CHANGES: ${{ steps.meta.outputs.maintainer-changes }}
          DIRECTORY: ${{ steps.meta.outputs.directory }}
          DEPENDENCIES: ${{ steps.meta.outputs.dependency-names }}
        run: |
          set -euo pipefail

          reason=""
          case "$UPDATE_TYPE" in
            version-update:semver-patch|version-update:semver-minor) ;;
            *) reason="it is a ${UPDATE_TYPE#version-update:semver-} bump, which can need code changes" ;;
          esac
          if [ -z "$reason" ] && [ "$MAINTAINER_CHANGES" = "true" ]; then
            reason="Dependabot reports a maintainer change for the package"
          fi
          if [ -z "$reason" ]; then
            case "$DIRECTORY" in
              /|/infra|/web|/extension) ;;
              *) reason="CI does not build $DIRECTORY" ;;
            esac
          fi

          if [ -n "$reason" ]; then
            echo "Not auto-merging: $reason."
            if [ "$ACTION" = "opened" ]; then
              gh pr comment "$PR_URL" --body "Not auto-merged because $reason. It waits for the weekly maintenance pass."
            fi
            exit 0
          fi

          # Auto-merge waits only for the checks main requires. If the
          # ruleset doesn't require the jobs that build this code, enabling it
          # would merge on whatever happens to be green, so refuse instead.
          required=$(gh api "repos/$REPO/rules/branches/main" \
            --jq '[.[] | select(.type == "required_status_checks") | .parameters.required_status_checks[].context] | unique | join(" ")')
          for check in check db-tests web extension; do
            case " $required " in
              *" $check "*) ;;
              *)
                echo "::error::main's ruleset does not require the '$check' check (required: '$required'); refusing to enable auto-merge."
                if [ "$ACTION" = "opened" ]; then
                  gh pr comment "$PR_URL" --body "Qualifies for auto-merge, but main's ruleset does not require the \`$check\` check, so auto-merge was not enabled. See docs/infrastructure.md, \"Dependabot auto-merge\"."
                fi
                exit 1
                ;;
            esac
          done

          gh pr merge "$PR_URL" --auto --squash
          if [ "$ACTION" = "opened" ]; then
            gh pr comment "$PR_URL" --body "Auto-merge enabled for $DEPENDENCIES. It merges once the required checks pass."
          fi

  # A merge made with the built-in token doesn't fire push workflows, so
  # Deploy would never run for an auto-merged update. Dispatch it instead; a
  # person's merge fires the push trigger as usual and is skipped here.
  deploy:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.merged_by.login == 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch Deploy on main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh workflow run deploy.yml --repo "$REPO" --ref main
