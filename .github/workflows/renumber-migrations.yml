name: Renumber migrations

# Two open PRs that each add a migration take the same number, so whichever
# merges second conflicts in src/db/migrations (CLAUDE.md). The fix is always
# the same: merge main, leave those conflicts, run `npm run db:renumber`. This
# workflow does that for every open PR, each time main moves, so a PR doesn't
# sit conflicted until someone notices.
#
# It acts only on a PR whose conflicts with main are all inside
# src/db/migrations. A PR that also conflicts anywhere else is left alone,
# with a line in this run's log: that needs a person (or an agent) to resolve
# the code first. A PR that merges cleanly is not touched. It merges and
# pushes; it never rebases or force-pushes, so a push that lost a race with
# someone else's is rejected and the PR is left for the next run.
#
# The push uses MIGRATION_RENUMBER_TOKEN, not the built-in token: a push made
# with the built-in token starts no workflows, so CI would never run on the
# renumbered branch and the PR could not merge. The token is a fine-grained
# personal access token (or a GitHub App's) limited to this repository, with
# Contents: read and write and Pull requests: read. Setup is in
# docs/infrastructure.md, "Migration renumbering".
#
# What runs with that token: npm ci from main's lockfile (install scripts
# off), then each PR branch's own scripts/renumber-migrations.ts and
# src/db/schema.ts. Only branches in this repository are touched, never a
# fork's, so that is code written by someone who can already push here.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One at a time: two runs renumbering the same branch would race.
concurrency:
  group: renumber-migrations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renumber:
    runs-on: ubuntu-latest
    steps:
      - name: Require the push token
        env:
          TOKEN: ${{ secrets.MIGRATION_RENUMBER_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::MIGRATION_RENUMBER_TOKEN is not set, so no PR's migrations are renumbered. See docs/infrastructure.md, \"Migration renumbering\"."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.MIGRATION_RENUMBER_TOKEN }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # Main's dependencies serve every branch: renumbering needs only tsx and
      # drizzle-kit, which a branch does not change.
      - run: npm ci --ignore-scripts

      - name: Renumber each PR whose only conflicts are migrations
        env:
          GH_TOKEN: ${{ secrets.MIGRATION_RENUMBER_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          prs=$(gh pr list --repo "$REPO" --base main --state open --limit 200 \
            --json number,headRefName,isCrossRepository,author \
            --jq '.[] | select(.isCrossRepository | not) | select(.author.login != "dependabot[bot]" and .author.login != "app/dependabot") | "\(.number) \(.headRefName)"')

          renumbered=""
          left=""
          while read -r number branch; do
            [ -z "$number" ] && continue
            if ! git fetch --quiet origin "+refs/heads/$branch:refs/remotes/origin/$branch"; then
              echo "#$number: could not fetch $branch; skipped."
              continue
            fi

            out=$(git merge-tree --write-tree --name-only origin/main "origin/$branch")
            if [ $? -eq 0 ]; then
              continue
            fi
            # Line 1 is the tree; the conflicted paths follow, up to a blank line.
            conflicted=$(printf '%s\n' "$out" | sed -n '2,/^$/p' | sed '/^$/d')
            elsewhere=$(printf '%s\n' "$conflicted" | grep -v '^src/db/migrations/' || true)
            if [ -n "$elsewhere" ]; then
              echo "#$number ($branch) conflicts outside the migrations folder; left alone:"
              printf '    %s\n' $elsewhere
              left="$left #$number"
              continue
            fi
            if ! git cat-file -e "origin/$branch:scripts/renumber-migrations.ts" 2>/dev/null; then
              echo "#$number ($branch) has no scripts/renumber-migrations.ts; left alone."
              left="$left #$number"
              continue
            fi

            echo "::group::#$number ($branch)"
            git checkout --quiet -B renumber "origin/$branch"
            git merge --no-edit origin/main >/dev/null 2>&1
            if npx tsx scripts/renumber-migrations.ts && [ -z "$(git diff --name-only --diff-filter=U)" ]; then
              git commit --quiet --no-edit -m "Merge main; renumber this branch's migrations after main's (db:renumber)

          Done by .github/workflows/renumber-migrations.yml: the only conflicts with main were in src/db/migrations."
              # A plain push: if the branch moved since the fetch, it is rejected and the next run tries again.
              if git push --quiet origin "HEAD:refs/heads/$branch"; then
                renumbered="$renumbered #$number"
              else
                echo "Push to $branch was rejected (the branch moved); left for the next run."
                left="$left #$number"
              fi
            else
              echo "db:renumber could not put #$number in order; left alone."
              git merge --abort 2>/dev/null || git reset --quiet --hard
              left="$left #$number"
            fi
            git checkout --quiet main
            echo "::endgroup::"
          done <<< "$prs"

          echo "Renumbered:${renumbered:- none}"
          echo "Left for a person:${left:- none}"
          {
            echo "**Renumbered:**${renumbered:- none}"
            echo
            echo "**Left for a person:**${left:- none}"
          } >> "$GITHUB_STEP_SUMMARY"
