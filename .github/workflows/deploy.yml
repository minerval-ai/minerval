name: Deploy

on:
  push:
    branches: [main]

# CloudFormation refuses concurrent updates, so parallel deploys fail with
# UPDATE_IN_PROGRESS (a burst of merges loses every deploy but the first).
# Queue them serially instead: cancel-in-progress stays false so a running CDK
# deploy is never killed mid-update, and GitHub keeps only the newest pending
# run per group, so a merge burst collapses into "current deploy, then latest".
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npx vitest run

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: CDK deploy
        working-directory: infra
        run: |
          npm ci
          npx tsc --noEmit
          npx cdk deploy --all --require-approval never
