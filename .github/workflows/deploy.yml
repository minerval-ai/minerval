name: Deploy

# Also dispatchable: the Dependabot security workflow dispatches it after an
# auto-merge, whose push doesn't fire this trigger.
on:
  push:
    branches: [main]
  workflow_dispatch:

# AWS access is a short-lived OIDC session, not a stored key: the role in
# AWS_DEPLOY_ROLE_ARN trusts only this repository's main branch and may only
# assume the CDK bootstrap roles (docs/infrastructure.md, "Deploy
# credentials"). Nothing else in this workflow needs to write.
permissions:
  contents: read
  id-token: write

# CloudFormation refuses concurrent updates, so parallel deploys fail with
# UPDATE_IN_PROGRESS (a burst of merges loses every deploy but the first).
# Queue them serially instead: cancel-in-progress stays false so a running CDK
# deploy is never killed mid-update, and GitHub keeps only the newest pending
# run per group, so a merge burst collapses into "current deploy, then latest".
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npx vitest run

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: CDK deploy
        working-directory: infra
        run: |
          npm ci
          npx tsc --noEmit
          npx cdk deploy --all --require-approval never
