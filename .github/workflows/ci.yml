name: CI

# Every PR, whatever its base: feature-branch PRs carry the same money-path
# code as main-bound ones, and the main-only filter meant nothing here (unit
# suite and db-tests alike) actually ran on them.
on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npx vitest run

      - name: CDK synth
        working-directory: infra
        run: |
          npm ci
          npx cdk synth

  db-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Postgres 16 with pgvector baked in — migration 0000 needs the
        # vector extension before anything else can apply.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: episteme
          POSTGRES_PASSWORD: episteme
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U episteme"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The suite's global setup creates the scratch DB, enables pgvector,
      # and applies the full migration chain from zero — a broken migration
      # fails this job before any test runs.
      - name: DB-backed tests
        run: npm run test:db

  # The S1 Matcher golden suite (#334 L4) — the per-PR regression net for the
  # one agent whose task saturates. ~$0.06 and ~2 minutes of real LLM calls
  # against 30 pinned pairs, so it runs on every PR without a path filter: a
  # filter that guesses wrong fails open, and the whole point is that a prompt
  # or model change can't silently move the Matcher.
  #
  # §21 coherence needs no job here — those rules are pure functions, unit
  # tested in tests/unit/scripts/corpus-metrics.test.ts, and already gate every
  # PR through the `check` job's vitest run.
  golden:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Supersede a PR's own in-flight run rather than paying for both.
    concurrency:
      group: golden-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: episteme
          POSTGRES_PASSWORD: episteme
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U episteme"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # lib.ts pins DATABASE_URL to this and refuses to run against 'episteme'.
      CORPUS_DATABASE_URL: postgresql://episteme:episteme@localhost:5432/episteme_corpus
      # MUST track infra/lib/api-stack.ts — production sets MATCHER_MODEL there
      # (#337 put the Matcher on DeepSeek via OpenRouter), while config.ts's
      # DEFAULT is still Haiku. A gate that inherits the default protects a
      # model production doesn't run: measured live, Haiku scores 28/30 on
      # these pins at $0.30, where DeepSeek scores 30/30 at $0.06 — so an
      # unpinned job would have failed every PR while testing the wrong thing.
      MATCHER_MODEL: deepseek/deepseek-v4-flash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The suite spends real money, so it needs real keys: OpenAI for the
      # embeddings it seeds with, and the Matcher's own provider (OpenRouter
      # by default, per #337). A PR from a fork gets no secrets at all, and a
      # repo that hasn't configured them yet must not have every PR blocked —
      # so absence SKIPS with a warning instead of failing. `secrets` is not
      # available to a job-level `if`, hence the step-output gate.
      - name: Check for eval keys
        id: keys
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ] && [ -n "$OPENROUTER_API_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Golden suite skipped::OPENAI_API_KEY and/or OPENROUTER_API_KEY are not configured for this run, so the Matcher regression net did not run."
          fi

      # Creates the isolated corpus DB, enables pgvector, applies the full
      # migration chain. An empty graph also means an empty retrieval pool, so
      # the only claims the Matcher can see are the pair's own seeds.
      - name: Prepare corpus database
        if: steps.keys.outputs.available == 'true'
        run: npm run corpus:reset

      # Retries, not a loose threshold, are what make this gate non-flaky.
      # Measured on deepseek-v4-flash: a full 30-pair run scored 28/30, but the
      # two failures (neg-03, spec-05) each passed 5/5 when re-run in
      # isolation — they sit on a genuine decision boundary and fail roughly
      # one run in six. Single-shot at --min-pass=0.95 would therefore block
      # the repo on a coin-flip about a third of the time, while dropping the
      # threshold to 0.9 would wave through a real three-pair regression.
      #
      # --retries=2 re-seeds and re-runs only the pairs that failed, so a
      # boundary pair has to fail three times to fail the build (~0.3% at the
      # measured rate) while a genuinely broken pair still fails every attempt.
      # --min-pass=0.95 then tolerates one HARD failure on top of that. Pairs
      # that needed a retry are reported by name, so a suite drifting toward
      # the boundary shows up even on a green run.
      - name: Matcher golden suite
        if: steps.keys.outputs.available == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: npm run corpus:golden -- --retries=2 --min-pass=0.95

      - name: Annotate failed pairs
        if: always() && steps.keys.outputs.available == 'true'
        run: |
          report="$(ls -1d runs/golden-matcher-* 2>/dev/null | tail -1)/golden-report.json"
          if [ ! -f "$report" ]; then
            echo "no golden report produced"
            exit 0
          fi
          node -e '
            const fs = require("node:fs");
            const r = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            for (const f of r.results.filter((x) => !x.pass)) {
              console.log(`::warning title=Golden pair ${f.id} failed::[${f.category}] ${f.failures.join("; ")}`);
            }
            console.log(`pass rate ${r.summary.passed}/${r.summary.total}`);
          ' "$report"

      - name: Upload golden report
        if: always() && steps.keys.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: golden-report
          path: runs/golden-matcher-*/golden-report.json
          if-no-files-found: ignore

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate plugin
        run: claude plugin validate ./plugin

      - name: Validate marketplace
        run: claude plugin validate .
