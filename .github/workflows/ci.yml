name: CI

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npx vitest run

      - name: CDK synth
        working-directory: infra
        run: |
          npm ci
          npx cdk synth

  db-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Postgres 16 with pgvector baked in — migration 0000 needs the
        # vector extension before anything else can apply.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: episteme
          POSTGRES_PASSWORD: episteme
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U episteme"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The suite's global setup creates the scratch DB, enables pgvector,
      # and applies the full migration chain from zero — a broken migration
      # fails this job before any test runs.
      - name: DB-backed tests
        run: npm run test:db

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate plugin
        run: claude plugin validate ./plugin

      - name: Validate marketplace
        run: claude plugin validate .
