name: CI

# Every PR, whatever its base: feature-branch PRs carry the same money-path
# code as main-bound ones, and the main-only filter meant nothing here (unit
# suite and db-tests alike) actually ran on them.
on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # scripts/ is outside the build's rootDir and runs through tsx, which
      # never checks types — so the corpus harness is checked here explicitly.
      - name: Typecheck scripts
        run: npm run typecheck:scripts

      - name: Test
        run: npx vitest run

      # The CDK app runs through tsx, which strips types without checking
      # them, so the infra code is typechecked here before synth.
      - name: CDK typecheck and synth
        working-directory: infra
        run: |
          npm ci
          npx tsc --noEmit
          npx cdk synth

  db-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Postgres 16 with pgvector baked in — migration 0000 needs the
        # vector extension before anything else can apply.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: episteme
          POSTGRES_PASSWORD: episteme
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U episteme"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The suite's global setup creates the scratch DB, enables pgvector,
      # and applies the full migration chain from zero — a broken migration
      # fails this job before any test runs.
      - name: DB-backed tests
        run: npm run test:db

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate plugin
        run: claude plugin validate ./plugin

      - name: Validate marketplace
        run: claude plugin validate .
